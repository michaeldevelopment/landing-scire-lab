name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Un despliegue a la vez. Si llegan varios push seguidos, se cancela el
# anterior en vez de pelearse por el entorno de Pages.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  construir-y-desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Construir el sitio
        run: pnpm build

      # GitHub Pages esta configurado como "Deploy from a branch", no
      # "GitHub Actions": por eso publicamos el contenido ya construido
      # (dist/) en la rama gh-pages en vez de usar actions/deploy-pages.
      - name: Publicar dist/ en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
